server:
  url: https://192.168.12.43

agent:
  check_interval: 60
  heartbeat_interval: 300

collectors:
  suricata:
    enabled: true
    path: /var/log/suricata/eve.json

inventory:
  enabled: true
  interval: 300

dlp:
  enabled: true
  scan_interval: 30
  realtime_enabled: true
  scan_paths:
    - /
  monitored_extensions:
    - .docx
    - .xlsx
    - .pdf
    - .txt
    - .env
    - .conf
    - .yaml
    - .json

monitoring:
  enabled: true
  services:
    enabled: true
    monitored_services:
      - postgresql
      - suricata
      - nginx
      - redis-server
    check_apt_updates: true

logging:
  level: INFO
  file: /var/log/vant-agent/vant-agent.log
  max_bytes: 10485760
  backup_count: 5
