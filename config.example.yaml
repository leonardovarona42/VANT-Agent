# VANT-Agent Configuration
# Copy to config.yaml and customize for your environment

server:
  url: "http://VANT-SIEM-SERVER:8000"
  logs_url: "http://VANT-SIEM-SERVER:9201"
  auth_mode: "none"  # none | basic | token
  auth_token: ""
  auth_username: ""
  auth_password: ""
  timeout: 15
  tls:
    verify: true
    ca_cert: ""

agent:
  id: ""  # auto-generated if empty
  host_name: ""  # auto-detected if empty
  check_interval: 60        # seconds between log collection cycles
  heartbeat_interval: 300   # seconds between heartbeats
  max_batch_size: 500
  log_every_cycles: 60

collectors:
  snort:
    enabled: false
    path: "/var/log/snort/alert_json.txt"
    source_type: "snort"
  suricata:
    enabled: false
    path: "/var/log/suricata/eve.json"
    source_type: "suricata"
  windows_eventlog:
    enabled: false
    channels:
      - Security
      - System
      - Application
  postgres:
    enabled: false
    path: "/var/log/postgresql/postgresql-*.log"
  file_logs:
    enabled: false
    items: []

inventory:
  enabled: true
  interval: 86400  # seconds (24h) between full inventory submissions

dlp:
  enabled: false
  scan_paths:
    - "C:\\Users"
    - "C:\\Documents"
  scan_extensions:
    - ".docx"
    - ".xlsx"
    - ".pdf"
    - ".txt"
  keywords:
    - "clasificado"
    - "secreto"
    - "restringido"

logging:
  level: "INFO"
  file: ""  # auto: executable_dir/vant-agent.log
  max_bytes: 10485760   # 10MB
  backup_count: 5
