title: Potential Credential Access via LSASS Memory Access
id: 3e4b5f6a-7c8d-9e0f-1a2b-3c4d5e6f7a8b
description: Detects potential access to LSASS memory which may indicate credential dumping attempts
status: experimental
author: VANT-SIEM Rules Team
date: 2024/09/15
logsource:
    product: windows
    category: process_access
detection:
    selection:
        TargetImage: '*\lsass.exe'
        GrantedAccess: 0x1fffff  # PROCESS_ALL_ACCESS
    filter:
        CallerImage: '*\windows\system32\services.exe'
        CallerImage: '*\windows\system32\lsass.exe'
    condition: selection and not filter
level: high
tags:
    - attack.credential_access
    - attack.t1003.001  # LSASS Memory